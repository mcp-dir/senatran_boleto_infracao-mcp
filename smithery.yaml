# Smithery configuration for SENATRAN: Boleto da Infração
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_senatran_boleto_infracao

name: senatran_boleto_infracao-mcp
displayName: "SENATRAN: Boleto da Infração"
description: >
  SENATRAN: Boleto da Infração, consulta em fonte oficial. Hospedado pela plataforma, sem credenciais da plataforma, pague por consulta com crédito pré-pago.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/senatran_boleto_infracao-mcp
repository: https://github.com/mcp-dir/senatran_boleto_infracao-mcp

tags:
  - senatran_boleto_infracao
  - brazil
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_senatran_boleto_infracao

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_senatran_boleto_infracao/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
